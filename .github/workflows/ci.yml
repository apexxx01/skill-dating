name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The Prisma client is not generated on install; the types depend on it.
      - run: npx prisma generate
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Split so the frontend, which currently has known lint errors, cannot
      # hide a backend regression: the backend step blocks the build, the
      # whole-repo step only reports until the frontend is clean, at which
      # point continue-on-error should be removed and the two merged.
      - name: Lint backend (required)
        run: npx next lint --dir src/app/api --dir src/lib --dir tests --dir prisma --file src/middleware.ts
      - name: Lint whole repository (report only)
        continue-on-error: true
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The production build lints and type-checks the whole project, so a
    # rule that only reports elsewhere can still stop a deploy. Building here
    # keeps that from being discovered at release time. The only setting it
    # needs is the Clerk publishable key, because Clerk's provider in the root
    # layout is rendered while pages are prerendered. The key is public and the
    # value below is a placeholder of the right shape (it decodes to a
    # hostname), not a real instance; a deployment build uses the real one.
    # No secret, database or provider setting is read at build time.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Replays every migration into an empty database and compares the result with
      # schema.prisma. A non-empty diff (exit code 2) means the schema was edited
      # without a migration, or a migration was edited after it was committed.
      - name: Schema and migrations agree
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow
          --exit-code
      - name: Migrations apply to an empty database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read by the integration harness, which recreates the database, applies the
      # migrations and starts its own server on TEST_PORT.
      TEST_DB_BASE_URL: postgresql://postgres:postgres@localhost:5432
      TEST_DB_NAME: skill_dating_ci
      TEST_PORT: 3459
      # The suite creates real users and sessions on a Clerk DEVELOPMENT instance
      # through the Backend API, so it needs that instance's keys as repository
      # secrets (use a dedicated instance: the suite creates and deletes users).
      # Pull requests from forks do not receive secrets; the suite is skipped there.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Skip notice
        if: env.CLERK_SECRET_KEY == ''
        run: echo "::warning::CLERK_SECRET_KEY is not available to this run, so the integration suite was skipped."
      - uses: actions/checkout@v4
        if: env.CLERK_SECRET_KEY != ''
      - uses: actions/setup-node@v4
        if: env.CLERK_SECRET_KEY != ''
        with:
          node-version: 20
          cache: npm
      - if: env.CLERK_SECRET_KEY != ''
        run: npm ci
      - if: env.CLERK_SECRET_KEY != ''
        run: npx prisma generate
      - if: env.CLERK_SECRET_KEY != ''
        run: npm run test:integration
