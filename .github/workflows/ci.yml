name: CI

# Every push and every pull request runs the fast checks below. The slow one, the full integration suite against a production
# build, is in integration.yml (pull requests to main, and nightly).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Prisma client is not generated on install; the types depend on it.
      - run: npx prisma generate
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Split so the frontend, which currently has known lint errors, cannot
      # hide a backend regression: the backend step blocks the build, the
      # whole-repo step only reports until the frontend is clean, at which
      # point continue-on-error should be removed and the two merged.
      - name: Lint backend (required)
        run: npx next lint --dir src/app/api --dir src/lib --dir tests --dir prisma --file src/middleware.ts
      - name: Lint whole repository (report only)
        continue-on-error: true
        run: npm run lint

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The production build lints and type-checks the whole project, so a
    # rule that only reports elsewhere can still stop a deploy. Building here
    # keeps that from being discovered at release time. The only setting it
    # needs is the Clerk publishable key, because Clerk's provider in the root
    # layout is rendered while pages are prerendered. The key is public and the
    # value below is a placeholder of the right shape (it decodes to a
    # hostname), not a real instance; a deployment build uses the real one.
    # No secret, database or provider setting is read at build time.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Next's compiler cache: a build that changed a few files recompiles only those.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/schema.prisma') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Replays every migration into an empty database and compares the result with
      # schema.prisma. A non-empty diff (exit code 2) means the schema was edited
      # without a migration, or a migration was edited after it was committed.
      - name: Schema and migrations agree
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow
          --exit-code
      - name: Migrations apply to an empty database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run

  # The API description the frontend builds against. Fails when a route, a request schema or a response type changed and the
  # generated files were not regenerated (`npm run openapi:scan && npm run openapi:build && npm run openapi:client`).
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: operations.generated.ts, docs/openapi.json and the typed client are up to date
        run: npm run openapi:check

  # Lints the workflow files themselves (syntax, expressions, contexts). Shellcheck integration is off. A pinned release, fetched by its tag.
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Lint .github/workflows
        run: ./actionlint -color -shellcheck=
